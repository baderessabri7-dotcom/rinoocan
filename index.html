.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.chip{font:inherit;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;word-break:break-word}
.chip span{font-size:18px}
.chip.sel{background:var(--ok);color:#fff;border-color:var(--ok)}
label.t{display:block;font-weight:700;margin:0 0 8px}
input{font:inherit;width:100%;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.btn{font-size:17px;border:0;border-radius:12px;padding:11px 16px;color:#fff;background:var(--pri);cursor:pointer}
.btn.big{width:100%;font-size:19px;padding:13px;margin-bottom:12px}
.btn.ghost{background:var(--bg);color:var(--text);border:2px solid var(--line)}
.btn.ok,.btn.ready{background:var(--ok)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.me{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.me span{display:flex;align-items:center;gap:8px;font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;font-size:16px;padding:11px 4px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;display:block;border:2px solid var(--line);background:var(--card)}
.av.ph{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;background:var(--line);color:var(--text)}
.av.sm{width:30px;height:30px;font-size:14px}
.av.xs{width:22px;height:22px;font-size:11px;border-width:1px}
.poster{width:92px;height:132px;object-fit:cover;border-radius:12px;display:block;background:var(--line)}
.poster.ph{display:flex;align-items:center;justify-content:center;font-size:34px}
.poster.big{width:100%;height:auto;aspect-ratio:2/3}
.poster.mid{width:120px;height:172px;margin:0 auto 8px}
.srow{display:flex;gap:12px;margin-bottom:10px}
.info{flex:1;min-width:0}
.mt{font-size:22px;word-break:break-word}
.by2,.time,.pill{display:inline-flex;align-items:center;gap:6px}
.by2{color:var(--mut);font-size:13px;margin-top:4px}
.time{display:flex;margin-top:8px;background:var(--bg);border-radius:10px;padding:6px 10px;font-size:14px}
.jb{flex:1;font:inherit;font-size:14px;padding:9px 6px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.jb.yes{background:var(--ok);color:#fff;border-color:var(--ok)}
.jb.no{background:var(--red);color:#fff;border-color:var(--red)}
.who{margin-top:10px}
.wt{font-weight:700;font-size:14px;margin-bottom:6px}
.chipsrow{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 4px;font-size:13px}
.mut{color:var(--mut)}
.small{font-size:12px;margin-top:4px}
.link{font:inherit;background:none;border:0;color:var(--text);padding:8px 0 0;cursor:pointer;font-weight:700}
.link.del{color:var(--red);float:left}
.cbox{margin-top:8px}
.cm{display:flex;gap:8px;margin-bottom:8px;font-size:14px;word-break:break-word}
.cbox .row{flex-wrap:nowrap}
.cbox input{margin:0}
.cbox .btn{flex:0 0 auto;padding:8px 14px}
.empty{text-align:center;color:var(--mut);grid-column:1/-1;padding:20px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{font:inherit;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:8px;cursor:pointer;text-align:center}
.pw{position:relative}
.xdel{position:absolute;top:4px;left:4px;z-index:2;width:30px;height:30px;border-radius:99px;background:rgba(0,0,0,.7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.star{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.75);color:var(--gold);font-weight:700;border-radius:99px;padding:3px 9px;font-size:14px}
.rt{font-family:"Lalezar",sans-serif;font-size:18px;margin-top:6px;word-break:break-word}
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.sb{font-family:"Lalezar",sans-serif;font-size:20px;padding:10px 0;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.sb.on{background:var(--gold);color:#111;border-color:var(--gold)}
.avg{font-size:24px;font-weight:700;color:var(--gold);margin:4px 0 8px}
.wl{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);text-align:right}
.nm2{flex:1}
.orat{margin:12px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mbox{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:88vh;overflow:auto;text-align:center}
.mbox h3{font-size:24px;margin:0 0 10px}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;max-width:90%;text-align:center}
.warn{background:#fff3cd;color:#664d03;border-radius:12px;padding:12px;text-align:center;margin-bottom:12px}
.prev{width:90px;border-radius:10px;margin-bottom:8px}
.filebtn{display:block;text-align:center;font-family:"Lalezar",sans-serif;font-size:17px;padding:11px;border-radius:12px;border:2px dashed var(--line);background:var(--bg);cursor:pointer;margin-bottom:8px}
input.fileinp{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;padding:0;margin:0;border:0}
textarea{font:inherit;width:100%;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0 10px;resize:vertical}
input[type=range]{padding:0;margin:4px 0 0;border:0;background:none;accent-color:var(--ok)}
.mtabs{display:flex;gap:8px;margin:12px 0}
.mtab{flex:1;font-family:"Lalezar",sans-serif;font-size:17px;padding:9px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.mtab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.form,.res2{text-align:right}
.cr{padding:6px 0;border-bottom:1px solid var(--line)}
.crt{display:flex;justify-content:space-between;font-size:15px}
.cv,.fv{color:var(--ok)}
.fin{background:var(--bg);border:2px solid var(--gold);border-radius:14px;padding:10px;margin:14px 0 6px}
.fin .fv{color:var(--gold);font-size:22px}
.cb{margin:8px 0}
.bar{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.rv{padding:8px 0;border-bottom:1px solid var(--line)}
.rcm{background:var(--bg);border-radius:10px;padding:8px 10px;margin:4px 0;font-size:14px;word-break:break-word}
details{font-size:13px;margin-top:4px}
summary{cursor:pointer;color:var(--mut)}
.lcats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.lc{font-family:"Lalezar",sans-serif;font-size:15px;padding:6px 13px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.lc.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lhead .nm{font-weight:700}
.lbadge{margin-right:auto;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.ltitle{font-family:"Lalezar","Marhey",sans-serif;font-size:23px;margin:6px 0 2px;word-break:break-word}
.ltext{white-space:pre-wrap;word-break:break-word;line-height:1.95;font-size:16px;margin:6px 0}
.ltext.poem{text-align:center}
.limg{width:100%;max-height:560px;object-fit:contain;border-radius:12px;display:block;margin:8px 0;background:var(--bg)}
.acts{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.lk{font:inherit;font-size:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);border-radius:99px;padding:5px 14px;cursor:pointer}
.lk.on{background:var(--red);color:#fff;border-color:var(--red)}
.clk{font:inherit;font-size:12px;background:none;border:0;color:var(--mut);cursor:pointer;padding:2px 0;margin-top:2px}
.clk.on{color:var(--red);font-weight:700}
.cdel{font:inherit;font-size:12px;background:none;border:0;color:var(--red);cursor:pointer;padding:2px 8px}
.more{font:inherit;background:none;border:0;color:var(--mut);cursor:pointer;padding:0;font-weight:700}
.hide{display:none!important}
</style>

const $=id=>document.getElementById(id);
function h(t,a,...c){
  const e=document.createElement(t);
  if(a)for(const k in a){
    if(k==="class")e.className=a[k];
    else if(k==="on")for(const ev in a.on)e.addEventListener(ev,a.on[ev]);
    else if(k.indexOf("data-")===0)e.setAttribute(k,a[k]);
    else e[k]=a[k];
  }
  c.flat().forEach(x=>{if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(x))});
  return e;
}
function avatar(name,cls){
  const u=AV[(name||"").trim().toLowerCase()];
  if(u)return h("img",{class:"av "+(cls||""),src:u,alt:name});
  return h("div",{class:"av ph "+(cls||"")},Array.from((name||"?").trim())[0]||"?");
}
const idOf=n=>Array.from(n.trim().toLowerCase()).map(c=>c.codePointAt(0).toString(36)).join("_");
let db=null,me=null,selected=null,tab="s",movies=[],comments=[],ratings=[],pS=null,pR=null;
const open={},drafts={};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function warn(t){const w=$("warn");w.textContent=t;w.classList.remove("hide")}
function toast(t){const e=$("toast");e.textContent=t;e.classList.remove("hide");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add("hide"),3500)}

// ===== الدخول =====
function updateEnter(){$("enter").classList.toggle("ready",!!($("newName").value.trim()||selected))}
function knownNames(){
  const s=new Set();
  movies.forEach(m=>{s.add(m.by);Object.values(m.joins||{}).forEach(j=>j&&j.name&&s.add(j.name))});
  comments.forEach(c=>s.add(c.by));ratings.forEach(r=>s.add(r.by));
  return[...s].filter(Boolean);
}
function renderChips(){
  updateEnter();
  const names=[...DEFAULTS];
  knownNames().forEach(n=>{if(!names.some(x=>x.toLowerCase()===n.toLowerCase()))names.push(n)});
  const c=$("chips");c.innerHTML="";
  names.forEach(n=>c.append(h("button",{class:"chip"+(selected===n?" sel":""),on:{click:()=>{selected=n;$("newName").value="";renderChips()}}},avatar(n),h("span",null,n))));
}
$("newName").addEventListener("input",()=>{if($("newName").value.trim()){selected=null;renderChips()}updateEnter()});
$("enter").onclick=()=>{
  const name=$("newName").value.trim()||selected;
  if(!name){toast("اختر اسمك أو اكتب اسما جديدا");return}
  me=name;lsSet("mv_me",me);showApp();
};
$("leave").onclick=()=>{me=null;lsSet("mv_me",null);selected=null;$("newName").value="";$("app").classList.add("hide");$("login").classList.remove("hide");renderChips()};
function showApp(){
  $("login").classList.add("hide");$("app").classList.remove("hide");
  $("meBox").innerHTML="";$("meBox").append(avatar(me,"sm"),me);
  render();
}

// ===== التبويبات والنماذج =====
function setTab(t){
  tab=t;
  [["s","tS","pS"],["r","tR","pR"],["l","tL","pL"]].forEach(([k,b,pn])=>{$(b).classList.toggle("on",t===k);$(pn).classList.toggle("hide",t!==k)});
}
$("tS").onclick=()=>setTab("s");$("tR").onclick=()=>setTab("r");$("tL").onclick=()=>setTab("l");
$("sToggle").onclick=()=>$("sForm").classList.toggle("hide");
$("rToggle").onclick=()=>$("rForm").classList.toggle("hide");
async function readPoster(file,mx){
  const url=URL.createObjectURL(file);
  try{
    const i=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});
    const s=Math.min(1,(mx||380)/Math.max(i.width,i.height)),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(i.width*s));c.height=Math.max(1,Math.round(i.height*s));
    c.getContext("2d").drawImage(i,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",.75);
  }catch(e){return null}
  finally{URL.revokeObjectURL(url)}
}
function bindFile(fid,pid,set,mx){
  $(fid).addEventListener("change",async e=>{
    const f=e.target.files[0];if(!f)return;
    const d=await readPoster(f,mx);set(d);
    if(d){$(pid).src=d;$(pid).classList.remove("hide");toast("تم اختيار الصورة ✅")}else toast("تعذر قراءة الصورة، جرّب صورة JPG أو PNG");
    e.target.value="";
  });
}
bindFile("sFile","sPrev",d=>pS=d);bindFile("rFile","rPrev",d=>pR=d);
async function addMovie(kind,title,poster,time,type){
  if(!title){toast("اكتب اسم العمل");return false}
  if(!db){toast("لا يوجد اتصال بقاعدة البيانات");return false}
  const joins=kind==="suggest"?{[idOf(me)]:{name:me,v:"yes"}}:{};
  try{await db.collection("movies").add({title,poster:poster||"",time:time||"",by:me,kind,t:Date.now(),joins,...(kind==="rate"?{type:type||""}:{})});return true}
  catch(e){warn("تعذر الحفظ: "+(e.code||e.message)+" — تأكد من قواعد Firestore (Rules).");return false}
}
$("sAdd").onclick=async()=>{
  if(await addMovie("suggest",$("sTitle").value.trim(),pS,$("sTime").value.trim())){
    $("sTitle").value="";$("sTime").value="";$("sFile").value="";pS=null;$("sPrev").classList.add("hide");$("sForm").classList.add("hide");toast("تم نشر الاقتراح 🍿");
  }
};
$("rAdd").onclick=async()=>{
  if(await addMovie("rate",$("rTitle").value.trim(),pR,"",rType)){
    $("rTitle").value="";$("rFile").value="";pR=null;rFil="all";$("rPrev").classList.add("hide");$("rForm").classList.add("hide");toast("تمت إضافة العمل ⭐");
  }
};


// ===== أقسام التقييمات =====
const RTYPES=[["film","🎬 أفلام"],["series","📺 مسلسلات"],["anime","🎌 أنميات"],["char","👤 شخصيات"]];
let rType="film",rFil="all",rSort="new";
const typeEmoji=k=>{const t=RTYPES.find(x=>x[0]===k);return t?t[1].split(" ")[0]:"❔"};
function renderRCats(){
  const f=$("rFormTypes");f.innerHTML="";
  RTYPES.forEach(([k,n])=>f.append(h("button",{class:"lc"+(rType===k?" on":""),on:{click:()=>{rType=k;renderRCats()}}},n)));
  const g=$("rFilter");g.innerHTML="";
  const base=movies.filter(m=>m.kind!=="lit");
  const opts=[["all","الكل"],...RTYPES];
  if(base.some(m=>!m.type))opts.push(["none","❔ غير مصنّف"]);
  opts.forEach(([k,n])=>{
    const c=k==="all"?base.length:k==="none"?base.filter(m=>!m.type).length:base.filter(m=>m.type===k).length;
    g.append(h("button",{class:"lc"+(rFil===k?" on":""),on:{click:()=>{rFil=k;renderR()}}},n+" ("+c+")"));
  });
}
function renderRSort(){
  const g=$("rSort");g.innerHTML="";
  [["new","🕒 الأحدث"],["top","⭐ الأعلى تقييمًا"],["many","👥 الأكثر تقييمات"]].forEach(([k,n])=>
    g.append(h("button",{class:"lc"+(rSort===k?" on":""),on:{click:()=>{rSort=k;renderR()}}},n)));
}
function typePicker(m){
  const box=h("div",{style:"margin-top:12px"});
  const draw=()=>{
    box.innerHTML="";
    box.append(h("div",{class:"mut small"},"تصنيف العمل:"));
    const row=h("div",{class:"lcats"});
    RTYPES.forEach(([k,n])=>row.append(h("button",{class:"lc"+(m.type===k?" on":""),on:{click:()=>{
      m.type=k;draw();
      db.collection("movies").doc(m.id).set({type:k},{merge:true}).then(()=>toast("تم تغيير التصنيف")).catch(()=>toast("تعذر الحفظ"));
    }}},n)));
    box.append(row);
  };
  draw();return box;
}

// ===== العرض =====
const sortNew=(a,b)=>(b.t||0)-(a.t||0);
function poster(m,cls){return m.poster?h("img",{class:"poster "+(cls||""),src:m.poster,alt:m.title}):h("div",{class:"poster ph "+(cls||"")},"🎬")}
function avgOf(id){const a=ratings.filter(r=>r.movie===id);if(!a.length)return null;return{v:(a.reduce((s,r)=>s+r.score,0)/a.length).toFixed(1),n:a.length}}
function snapFocus(){const a=document.activeElement;return a&&a.getAttribute&&a.getAttribute("data-k")?{k:a.getAttribute("data-k"),p:a.selectionStart}:null}
function restoreFocus(f){if(!f)return;const e=document.querySelector('[data-k="'+f.k+'"]');if(e){e.focus();try{e.setSelectionRange(f.p,f.p)}catch(x){}}}
function render(){if(!me)return;renderS();renderR();renderL()}

function setJoin(m,v){
  const cur=((m.joins||{})[idOf(me)]||{}).v;
  db.collection("movies").doc(m.id).set({joins:{[idOf(me)]:{name:me,v:cur===v?"":v}}},{merge:true}).catch(()=>toast("تعذر الحفظ"));
}
function sendC(m){
  const t=(drafts[m.id]||"").trim();if(!t||!db)return;
  drafts[m.id]="";
  db.collection("mv_comments").add({movie:m.id,by:me,text:t,t:Date.now()}).catch(()=>toast("تعذر إرسال التعليق"));
}
async function delMovie(m){
  if(!confirm("حذف «"+(m.title||"هذا المنشور")+"»؟"))return;
  try{
    await db.collection("movies").doc(m.id).delete();
    await Promise.all([...comments.filter(c=>c.movie===m.id).map(c=>db.collection("mv_comments").doc(c.id).delete()),...ratings.filter(r=>r.movie===m.id).map(r=>db.collection("mv_ratings").doc(r.id).delete())]);
  }catch(e){toast("تعذر الحذف")}
}
function suggCard(m){
  const joins=Object.values(m.joins||{}).filter(j=>j&&j.name),yes=joins.filter(j=>j.v==="yes"),no=joins.filter(j=>j.v==="no");
  const mine=(m.joins||{})[idOf(me)]||{};
  const cs=comments.filter(c=>c.movie===m.id).sort((a,b)=>(a.t||0)-(b.t||0));
  const card=h("div",{class:"card"},
    h("div",{class:"srow"},poster(m),h("div",{class:"info"},
      h("div",{class:"mt"},m.title),
      h("div",{class:"by2"},avatar(m.by,"xs"),"اقترحه "+m.by),
      m.time?h("div",{class:"time"},"🕘 "+m.time):null)),
    h("div",{class:"row"},
      h("button",{class:"jb"+(mine.v==="yes"?" yes":""),on:{click:()=>setJoin(m,"yes")}},"✅ سأشاهده معك"),
      h("button",{class:"jb"+(mine.v==="no"?" no":""),on:{click:()=>setJoin(m,"no")}},"❌ لن أشاهده")),
    h("div",{class:"who"},
      h("div",{class:"wt"},"سيشاهدون ("+yes.length+"):"),
      h("div",{class:"chipsrow"},yes.length?yes.map(j=>h("span",{class:"pill"},avatar(j.name,"xs"),j.name)):h("span",{class:"mut"},"لا أحد بعد")),
      no.length?h("div",{class:"mut small"},"لن يشاهدوا: "+no.map(j=>j.name).join("، ")):null),
    h("button",{class:"link",on:{click:()=>{open[m.id]=!open[m.id];renderS()}}},"💬 التعليقات ("+cs.length+")"),
    m.by===me?h("button",{class:"link del",on:{click:()=>delMovie(m)}},"🗑 حذف"):null);
  if(open[m.id])card.append(h("div",{class:"cbox"},
    cs.map(c=>h("div",{class:"cm"},avatar(c.by,"xs"),h("div",{style:"flex:1"},h("b",null,c.by),h("div",null,c.text),c.by===me?h("button",{class:"cdel",style:"padding:2px 0",on:{click:()=>delComment(c)}},"🗑 حذف"):null))),
    h("div",{class:"row"},
      h("input",{"data-k":"c"+m.id,placeholder:"مثلا: سأشاهده الساعة 9",value:drafts[m.id]||"",maxLength:200,on:{input:e=>{drafts[m.id]=e.target.value},keydown:e=>{if(e.key==="Enter")sendC(m)}}}),
      h("button",{class:"btn",on:{click:()=>sendC(m)}},"إرسال"))));
  return card;
}
function renderS(){
  const f=snapFocus(),box=$("sList");box.innerHTML="";
  const list=movies.filter(m=>m.kind!=="rate"&&m.kind!=="lit").sort(sortNew);
  if(!list.length)box.append(h("p",{class:"empty"},"ما فيه اقتراحات بعد. كن أول من يقترح عملا 🍿"));
  list.forEach(m=>box.append(suggCard(m)));
  restoreFocus(f);
}
function renderR(){
  const g=$("rList");g.innerHTML="";
  renderRCats();renderRSort();
  const list=movies.filter(m=>m.kind!=="lit"&&(rFil==="all"||(rFil==="none"?!m.type:m.type===rFil))).sort(sortNew);
  if(rSort==="top")list.sort((x,y)=>{const a=avgOf(x.id),b=avgOf(y.id);return (b?+b.v:-1)-(a?+a.v:-1)||(b?b.n:0)-(a?a.n:0)});
  if(rSort==="many")list.sort((x,y)=>{const a=avgOf(x.id),b=avgOf(y.id);return (b?b.n:0)-(a?a.n:0)||(b?+b.v:0)-(a?+a.v:0)});
  if(!list.length)g.append(h("p",{class:"empty"},"لا توجد أعمال هنا بعد ⭐"));
  list.forEach((m,i)=>{
    const a=avgOf(m.id);
    g.append(h("button",{class:"rc",on:{click:()=>openRate(m)}},
      h("div",{class:"pw"},poster(m,"big"),a?h("span",{class:"star"},"⭐ "+a.v):null,m.by===me?h("span",{class:"xdel",role:"button",title:"حذف",on:{click:e=>{e.stopPropagation();delMovie(m)}}},"🗑"):null),
      h("div",{class:"rt"},(rSort!=="new"&&a?"#"+(i+1)+" ":"")+m.title),
      h("div",{class:"mut small"},typeEmoji(m.type)+" "+(a?a.n+" تقييم":"بدون تقييم"))));
  });
}


// ===== الأدب =====
const LCATS=[["poem","📜 شعر"],["story","📖 قصة"],["prose","🖋️ خاطرة"],["pic","🖼️ صورة"]];
const catName=k=>(LCATS.find(c=>c[0]===k)||["","✍️ أدب"])[1];
let pL=null,lCat="poem",lFil="all";
function renderLCats(){
  const f=$("lFormCats");f.innerHTML="";
  LCATS.forEach(([k,n])=>f.append(h("button",{class:"lc"+(lCat===k?" on":""),on:{click:()=>{lCat=k;renderLCats()}}},n)));
  const g=$("lFilter");g.innerHTML="";
  [["all","الكل"],...LCATS].forEach(([k,n])=>g.append(h("button",{class:"lc"+(lFil===k?" on":""),on:{click:()=>{lFil=k;renderLCats();renderL()}}},n)));
}
$("lToggle").onclick=()=>$("lForm").classList.toggle("hide");
bindFile("lFile","lPrev",d=>pL=d,900);
$("lAdd").onclick=async()=>{
  const title=$("lTitle").value.trim(),text=$("lText").value.trim();
  if(!text&&!pL){toast("اكتب شيئا أو أضف صورة");return}
  if(!db){toast("لا يوجد اتصال بقاعدة البيانات");return}
  try{
    await db.collection("movies").add({title,text,poster:pL||"",cat:lCat,by:me,kind:"lit",t:Date.now(),joins:{},likes:{}});
    $("lTitle").value="";$("lText").value="";$("lFile").value="";pL=null;$("lPrev").classList.add("hide");$("lForm").classList.add("hide");toast("تم النشر ✍️");
  }catch(e){warn("تعذر الحفظ: "+(e.code||e.message)+" — تأكد من قواعد Firestore (Rules).")}
};
const likeCount=o=>Object.values(o.likes||{}).filter(Boolean).length;
const likedBy=o=>Object.values(o.likes||{}).filter(Boolean);
function toggleLike(col,o){
  const k=idOf(me),has=!!(o.likes||{})[k];
  db.collection(col).doc(o.id).set({likes:{[k]:has?"":me}},{merge:true}).catch(()=>toast("تعذر الحفظ"));
}
function delComment(c){
  if(!confirm("حذف التعليق؟"))return;
  db.collection("mv_comments").doc(c.id).delete().catch(()=>toast("تعذر الحذف"));
}
function litCard(m){
  const cs=comments.filter(c=>c.movie===m.id).sort((a,b)=>(a.t||0)-(b.t||0));
  const liked=!!(m.likes||{})[idOf(me)],n=likeCount(m),LIM=500;
  const long=(m.text||"").length>LIM&&!open["t"+m.id];
  const txt=long?m.text.slice(0,LIM)+"…":m.text;
  const card=h("div",{class:"card"},
    h("div",{class:"lhead"},avatar(m.by,"sm"),h("span",{class:"nm"},m.by),
      h("span",{class:"mut small",style:"margin:0"},m.t?new Date(m.t).toLocaleDateString("ar"):""),
      h("span",{class:"lbadge"},catName(m.cat))),
    m.title?h("div",{class:"ltitle"},m.title):null,
    txt?h("div",{class:"ltext"+(m.cat==="poem"?" poem":"")},txt):null,
    long?h("button",{class:"more",on:{click:()=>{open["t"+m.id]=true;renderL()}}},"اقرأ المزيد ⬇️"):null,
    m.poster?h("img",{class:"limg",src:m.poster,alt:m.title||""}):null,
    h("div",{class:"acts"},
      h("button",{class:"lk"+(liked?" on":""),on:{click:()=>toggleLike("movies",m)}},(liked?"❤️":"🤍")+" إعجاب ("+n+")"),
      h("button",{class:"lk",on:{click:()=>{open[m.id]=!open[m.id];renderL()}}},"💬 التعليقات ("+cs.length+")"),
      m.by===me?h("button",{class:"link del",style:"padding:0;margin-right:auto",on:{click:()=>delMovie(m)}},"🗑 حذف"):null),
    n?h("div",{class:"mut small"},"أعجب: "+likedBy(m).join("، ")):null);
  if(open[m.id])card.append(h("div",{class:"cbox"},
    cs.map(c=>{
      const cl=!!(c.likes||{})[idOf(me)],cn=likeCount(c);
      return h("div",{class:"cm"},avatar(c.by,"xs"),h("div",{style:"flex:1"},h("b",null,c.by),h("div",null,c.text),
        h("button",{class:"clk"+(cl?" on":""),on:{click:()=>toggleLike("mv_comments",c)}},(cl?"❤️":"🤍")+(cn?" "+cn:" أعجبني")),
        c.by===me?h("button",{class:"cdel",on:{click:()=>delComment(c)}},"🗑"):null));
    }),
    h("div",{class:"row"},
      h("input",{"data-k":"c"+m.id,placeholder:"اكتب تعليقا...",value:drafts[m.id]||"",maxLength:300,on:{input:e=>{drafts[m.id]=e.target.value},keydown:e=>{if(e.key==="Enter")sendC(m)}}}),
      h("button",{class:"btn",on:{click:()=>sendC(m)}},"إرسال"))));
  return card;
}
function renderL(){
  const f=snapFocus(),box=$("lList");box.innerHTML="";
  const list=movies.filter(m=>m.kind==="lit"&&(lFil==="all"||m.cat===lFil)).sort(sortNew);
  if(!list.length)box.append(h("p",{class:"empty"},"ما فيه منشورات بعد. كن أول من يكتب ✍️"));
  list.forEach(m=>box.append(litCard(m)));
  restoreFocus(f);
}
renderLCats();

// ===== التقييم =====
function openModal(...n){const b=$("mbox");b.innerHTML="";b.append(...n);$("modal").classList.remove("hide")}
function closeModal(){$("modal").classList.add("hide")}
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
function openRate(m){
  if(ratings.find(r=>r.movie===m.id&&r.by===me))return rateModal(m);
  openModal(poster(m,"mid"),h("h3",null,"هل شاهدت «"+m.title+"» فعلا؟"),
    h("div",{class:"row"},
      h("button",{class:"btn ok",on:{click:()=>rateModal(m,"mine")}},"نعم، شاهدته"),
      h("button",{class:"btn ghost",on:{click:()=>{closeModal();toast("قيّمه بعد ما تشاهده 😉")}}},"لا")),
    typePicker(m),
    m.by===me?h("button",{class:"btn ghost",style:"margin-top:10px;width:100%;color:var(--red)",on:{click:async()=>{await delMovie(m);closeModal()}}},"🗑 حذف هذا العمل"):null);
}
const CRIT=["كتابة الشخصيات","القصة","الحبكة","الدراما","الإخراج","التمثيل","الموسيقى والمؤثرات","المشاهد البصرية","الحوار","الإيقاع","النهاية","الأصالة والتجديد","التأثير العاطفي","المتعة والترفيه","قابلية إعادة المشاهدة"];
function rateModal(m,startView){
  const mine=ratings.find(r=>r.movie===m.id&&r.by===me);
  let view=startView||(mine?"res":"mine");
  const st={crit:Object.assign({},mine&&mine.crit),final:mine?mine.score:null,comment:(mine&&mine.comment)||""};
  function mineView(){
    const box=h("div",{class:"form"});
    const save=h("button",{class:"btn ok big",disabled:st.final==null,on:{click:async()=>{
      try{await db.collection("mv_ratings").doc(m.id+"_"+idOf(me)).set({movie:m.id,by:me,score:st.final,crit:st.crit,comment:st.comment.trim(),t:Date.now()});closeModal();toast("تم حفظ تقييمك ⭐")}
      catch(e){toast("تعذر حفظ التقييم")}
    }}},"حفظ تقييمي");
    box.append(h("div",{class:"wt"},"المعايير (من 0 إلى 10) — اختيارية، ولا تؤثر على النجمة"));
    CRIT.forEach((name,i)=>{
      const k="c"+i,val=h("b",{class:"cv"},st.crit[k]==null?"—":String(st.crit[k]));
      const sl=h("input",{type:"range",min:0,max:10,step:1,value:st.crit[k]==null?5:st.crit[k],on:{input:e=>{st.crit[k]=Number(e.target.value);val.textContent=e.target.value}}});
      box.append(h("div",{class:"cr"},h("div",{class:"crt"},h("span",null,name),val),sl));
    });
    const fv=h("b",{class:"fv"},st.final==null?"—":Number(st.final).toFixed(1));
    const fs=h("input",{type:"range",min:0,max:10,step:0.5,value:st.final==null?5:st.final,on:{input:e=>{st.final=Number(e.target.value);fv.textContent=st.final.toFixed(1);save.disabled=false}}});
    box.append(h("div",{class:"fin"},h("div",{class:"crt"},h("span",null,"⭐ تقييمك النهائي (مستقل عن المعايير)"),fv),fs));
    box.append(h("textarea",{rows:3,maxLength:300,placeholder:"اكتب رأيك: مثلا هذا أفضل عمل شفته لأن...",value:st.comment,on:{input:e=>{st.comment=e.target.value}}}),save);
    return box;
  }
  function resView(){
    const rs=ratings.filter(r=>r.movie===m.id).sort((x,y)=>y.score-x.score);
    if(!rs.length)return h("p",{class:"empty"},"لا تقييمات بعد");
    const box=h("div",{class:"res2"});
    box.append(h("div",{class:"mut small"},"النجمة = متوسط التقييمات النهائية لكل شخص فقط، والمعايير منفصلة عنها."));
    box.append(h("div",{class:"wt",style:"margin-top:10px"},"📊 معدل المعايير (الفريق)"));
    let any=false;
    CRIT.forEach((name,i)=>{
      const vs=rs.map(r=>r.crit&&r.crit["c"+i]).filter(v=>typeof v==="number");
      if(!vs.length)return;
      any=true;
      const a=vs.reduce((s,v)=>s+v,0)/vs.length;
      box.append(h("div",{class:"cb"},h("div",{class:"crt"},h("span",null,name),h("b",null,a.toFixed(1))),h("div",{class:"bar"},h("i",{style:"width:"+(a*10)+"%"}))));
    });
    if(!any)box.append(h("div",{class:"mut small"},"لا أحد قيّم المعايير بعد."));
    box.append(h("div",{class:"wt",style:"margin-top:14px"},"⭐ التقييم النهائي لكل شخص"));
    rs.forEach(r=>{
      const cr=r.crit||{},has=Object.keys(cr).length>0;
      box.append(h("div",{class:"rv"},
        h("div",{class:"wl"},avatar(r.by,"xs"),h("span",{class:"nm2"},r.by),h("b",null,"★ "+r.score)),
        r.comment?h("div",{class:"rcm"},r.comment):null,
        has?h("details",null,h("summary",null,"عرض معاييره"),CRIT.map((n,i)=>cr["c"+i]!=null?h("div",{class:"crt small"},h("span",null,n),h("b",null,String(cr["c"+i]))):null)):null));
    });
    return box;
  }
  function paint(){
    const a=avgOf(m.id);
    openModal(poster(m,"mid"),h("h3",null,m.title),
      h("div",{class:"avg"},a?"⭐ "+a.v+" ("+a.n+")":"لا تقييمات بعد"),
      h("div",{class:"mtabs"},
        h("button",{class:"mtab"+(view==="mine"?" on":""),on:{click:()=>{view="mine";paint()}}},"✍️ تقييمي"),
        h("button",{class:"mtab"+(view==="res"?" on":""),on:{click:()=>{view="res";paint()}}},"📊 النتائج")),
      view==="mine"?mineView():resView(),
      (()=>{const mr=ratings.find(r=>r.movie===m.id&&r.by===me);return mr?h("button",{class:"btn ghost",style:"margin-top:12px;width:100%;color:var(--red)",on:{click:async()=>{if(!confirm("حذف تقييمك؟"))return;try{await db.collection("mv_ratings").doc(mr.id).delete();closeModal();toast("تم حذف تقييمك")}catch(e){toast("تعذر الحذف")}}}},"🗑 حذف تقييمي"):null})(),
      typePicker(m),
      m.by===me?h("button",{class:"btn ghost",style:"margin-top:8px;width:100%;color:var(--red)",on:{click:async()=>{await delMovie(m);closeModal()}}},"🗑 حذف هذا العمل"):null,
      h("button",{class:"btn ghost",style:"margin-top:12px",on:{click:closeModal}},"إغلاق"));
  }
  paint();
}

// ===== الاتصال =====
renderChips();
try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(x){}}catch(e){db=null}
if(!db)warn("تعذر الاتصال بـ Firebase.");
else{
  const err=()=>warn("تعذر قراءة البيانات. تأكد أن Firestore مفعّل وأن القواعد (Rules) منشورة.");
  const sub=(col,fn)=>db.collection(col).onSnapshot(s=>{fn(s.docs.map(d=>({...d.data(),id:d.id})));if(me)render();else renderChips()},err);
  sub("movies",a=>movies=a);sub("mv_comments",a=>comments=a);sub("mv_ratings",a=>ratings=a);
}
const saved=lsGet("mv_me");
if(saved){me=saved;showApp()}
</script>
